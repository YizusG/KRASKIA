name: Preparar sitio estático para Hostinger
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: kraskia-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Preparar fotografía editorial KRASKIA 3.0
        run: bash scripts/fetch-visuals.sh
      - name: Generar archivos de producción
        run: npm run build
      - name: Sincronizar rama publicable sin reescribir historial
        shell: bash
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git clone --quiet --branch production "https://x-access-token:${TOKEN}@github.com/${REPO}.git" /tmp/kraskia-production
          rsync -a --delete --exclude='.git' dist/ /tmp/kraskia-production/
          cd /tmp/kraskia-production
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publicar KRASKIA: ${GITHUB_SHA}"
            git push origin HEAD:production
          fi
